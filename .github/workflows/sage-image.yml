# [S-005] Tests and builds Sage's wger image from the `sage` branch.
#
# Pull requests: tests and a build check, nothing published.
# Pushes to `sage` (merges): tests, then publishes
#   ghcr.io/vinneyj/wger-server:sage-<short commit>   (pin this one in homelab)
#   ghcr.io/vinneyj/wger-server:sage                  (latest build, for reference)
# Homelab's nodes are all amd64, so only that platform is built.
name: Sage image

on:
  push:
    branches: [sage]
  pull_request:
    branches: [sage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sage-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: settings.ci
      DJANGO_MEDIA_ROOT: /tmp/wger-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev --python 3.13
          mkdir -p /tmp/wger-test

      - name: Test
        run: uv run ./manage.py test --parallel auto

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Short commit
        id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on sage)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extras/docker/production/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/vinneyj/wger-server:sage-${{ steps.tag.outputs.short }}
            ghcr.io/vinneyj/wger-server:sage
          labels: |
            org.opencontainers.image.source=https://github.com/VinneyJ/wger
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
